name: Validate repository

on:
  push:
    branches:
      - main
      - "revamp/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure and local links
        run: python3 scripts/validate_repo.py

      - name: Check JavaScript syntax
        run: node --check assets/app.js
